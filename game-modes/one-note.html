<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1."> -->
  <link rel="stylesheet" href="../css/main.css">
  <title>HitNote</title>
</head>

<body data-theme="default">
  <header>
    <a class="home" href="../index.html">
      <img class="home" src="../midia/home.png" alt="House icon">
    </a>
    
    <h1>Hitnote</h1>
  </header>
  
  <main>
    <ul class="displays">
      <li>Played note:&nbsp;<span class="played-note">None</span></li>
      <li class="game-mode">Rounds:&nbsp;<span class="rounds">1</span></li>
      <li class="game-mode">Score:&nbsp;<span class="score">0</span></li>
      <li class="game-mode">Percentage:&nbsp;<span class="percentage">0.00</span>%</li>
    </ul>
    
    <div class="results"></div>
    
    <ul class="buttons">
      <li><button class="free-mode">Free Mode</button></li>
      <li class="game-mode"><button class="restart">Restart</button></li>
      <li class="game-mode"><button class="repeat">Repeat</button></li>
      <li class="game-mode"><button class="new-note">New Note</button></li>
      <li class="game-mode"><button class="chord-mode">Active Chord Mode</button></li>
      <li><button class="deactivate-notes">Deactivate Notes</button></li>
    </ul>
    
    <ul class="selections">
      <li>
        <p>Tonic note:</p>
        <select class="tonic-note">
          <option>C</option>
          <option>C#</option>
          <option>D</option>
          <option>D#</option>
          <option>E</option>
          <option>F</option>
          <option>F#</option>
          <option>G</option>
          <option>G#</option>
          <option>A</option>
          <option>A#</option>
          <option>B</option>
        </select>
      </li>
      
      <li>
        <p>Scale:</p>
        <select class="scale">
          <option>Chromatic</option>
          <option>Major</option>
          <option>Minor</option>
        </select>
      </li>
      
      <li>
        <p>Octaves:</p><input class="octaves-changer" type="number" value="2", min="1", max="5">
      </li>
      
      <li>
        <p>Theme:</p>
        <select class="theme">
          <option>Default</option>
          <option>Light Milk</option>
          <option>Wood</option>
        </select>
      </li>
      
      <li>
        <p>Piano color:</p>
        <select class="piano-colors">
          <option>Black and White</option>
          <option>Rainbow</option>
        </select>
      </li>
    </ul>
  </main>
  
  <footer>
    <p>HitNote&copy; - Created by Guilherme Aryel -06/05/2026</p>
  </footer>
</body>

<script type="module" src="../js/main.js"></script>
  
</html>
